name: Probe C23 official named coastlines
on:
  push:
    branches: [research/geo-C23-20261018]
    paths: [.github/workflows/c23_probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests pyshp
      - name: Probe direct official C23 archive and coastal naming geometry
        run: |
          python - <<'PY'
          import requests,zipfile,io,re,shapefile
          roots=[
          'https://nlftp.mlit.go.jp/ksj/gml/data/C23/C23-06/C23-06_22_GML.zip',
          'https://nlftp.mlit.go.jp/ksj/gml/data/C23/C23-06_22_GML.zip',
          'https://nlftp.mlit.go.jp/ksj/gml/data/C23/C23-06/C23-06_22.zip',
          'https://nlftp.mlit.go.jp/ksj/gml/data/C23/C23-06_22.zip']
          for u in roots:
            try:
              r=requests.get(u,timeout=22)
              print('CHECK',r.status_code,len(r.content),r.url,flush=True)
              if r.content[:2]!=b'PK':continue
              z=zipfile.ZipFile(io.BytesIO(r.content))
              print('ZIP',z.namelist()[:20],flush=True)
              for f in z.namelist():
                if f.endswith('.shp'):
                  print('FOUND SHP',f,flush=True)
                  stem=f[:-4]
                  rr=shapefile.Reader(shp=io.BytesIO(z.read(f)),shx=io.BytesIO(z.read(stem+'.shx')),dbf=io.BytesIO(z.read(stem+'.dbf')),encoding='cp932',encodingErrors='replace')
                  print('FIELDS',[field[0] for field in rr.fields[1:]],'N',len(rr),flush=True)
                  for feat in list(rr.iterShapeRecords())[:6]: print('PORTION',list(feat.record),feat.shape.shapeType,feat.shape.points[:3],flush=True)
                if f.endswith('.xml') and 'C23' in f.upper():
                  b=z.read(f)
                  print('XML',f,len(b),b[:2800].decode('utf-8','replace'),flush=True)
              break
            except Exception as e: print('ERR',str(e)[:400],flush=True)
          PY
