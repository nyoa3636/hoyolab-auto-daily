name: Coast geography beach candidates
on:
  push:
    branches: [research/sea-spots-20261018]
    paths: [output/national_sea_fishing_sites_surf_expanded.csv]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  osm-coasts:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests beautifulsoup4 shapely
      - name: Retrieve OpenStreetMap named beaches and municipal matches
        run: python research/add_osm_coasts.py
      - name: Commit OSM candidate layer
        run: |
          git config user.name "sea-coast-research-bot"
          git config user.email "sea-coast-research-bot@users.noreply.github.com"
          git add output/national_sea_fishing_sites_surf_and_osm.csv output/surf_beach_sites_and_osm.csv output/surf_osm_research_report.json
          git diff --staged --quiet || (git commit -m "Add OSM beach candidates to fishing research" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea-surf-candidates-with-osm
          path: output/*osm*
