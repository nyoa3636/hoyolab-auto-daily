name: Latest version

on:
  schedule:
    - cron: "0 18 * * *" # scheduled at 06:00 (UTC+8) everyday
  workflow_dispatch:

jobs:
  check-version:
    runs-on:
      group: Default
      labels: [self-hosted, Windows, X64, codex]
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Fetch package.json from original repo
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/sglkc/hoyolab-auto-daily/master/package.json' -OutFile 'remote-package.json'

      - name: Compare versions
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: pwsh
        run: |
          $localVersion = (Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json).version
          $remoteVersion = (Get-Content -Raw -LiteralPath 'remote-package.json' | ConvertFrom-Json).version
          Write-Host "Local version: $localVersion"
          Write-Host "Remote version: $remoteVersion"

          if ([version]$localVersion -lt [version]$remoteVersion) {
            Write-Host 'Repository version is outdated. Do sync your fork!'

            if ($env:DISCORD_WEBHOOK) {
              Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body (@{content='(INFO) New version released. Your repository is outdated.'} | ConvertTo-Json -Compress)
            }

            exit 1
          }
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on:
      group: Default
      labels: [self-hosted, Windows, X64, codex]
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
